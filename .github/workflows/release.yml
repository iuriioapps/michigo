name: Release

on:
  push:
    tags: ["v*"]

jobs:
  # Gate every platform build on the same checks CI runs, once.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # electron-builder names the release after package.json, not the tag,
      # so a mismatch would publish the wrong version. A prerelease tag of the
      # version (v1.0.0-test.1) passes, and the desktop job stamps it in.
      - name: Tag matches desktop version
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          case "${GITHUB_REF_NAME#v}" in
            "$version" | "$version"-*) ;;
            *)
              echo "::error::Tag $GITHUB_REF_NAME does not match apps/desktop version $version"
              exit 1
              ;;
          esac

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

  desktop:
    needs: verify
    # Electron apps must be built on the OS they target.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      # electron-builder needs write access to create the draft release.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build renderer and main
        run: pnpm --filter @michigo/desktop build

      # Semver sorts 1.0.0-test.1 below 1.0.0, so a test release never takes
      # the name of the real one, and an update can still move up to it.
      - name: Stamp the prerelease version
        if: contains(github.ref_name, '-')
        shell: bash
        working-directory: apps/desktop
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Package and upload to draft release
        run: pnpm --filter @michigo/desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Builds are UNSIGNED for now. macOS will be Gatekeeper-blocked and
          # Windows will trigger SmartScreen until these are filled in.
          # macOS signing + notarization (needs an Apple Developer account):
          # CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          # CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
