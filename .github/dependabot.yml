version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR per ecosystem cluster keeps review manageable.
      dev-tooling:
        patterns: ["oxlint*", "oxfmt", "turbo", "typescript", "vitest", "@vitest/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # Share one version; @orpc/tanstack-query requires the exact @orpc/client.
      orpc:
        patterns: ["@orpc/*"]
    ignore:
      # An Electron major changes the bundled Node, so .nvmrc and @types/node
      # must move with it (see .claude/rules/dependencies.md). Bump it
      # by hand as a deliberate decision.
      - dependency-name: electron
        update-types: ["version-update:semver-major"]
      # Node types stay on the Node line that Electron bundles (24), the
      # same ceiling as `engines` in package.json.
      - dependency-name: "@types/node"
        versions: [">=25"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
